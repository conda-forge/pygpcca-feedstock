context:
  name: pygpcca
  version: "1.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: d537851aa18687e40a153639587458597bac0d0f070cf094d25ca4251e3d0022

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  # PETSc/SLEPc are an optional extra on PyPI but always included here, so that
  # `method="krylov"` works out of the box.
  run:
    - python >=${{ python_min }}
    - numpy >=1.19
    - scipy >=1.5
    - docrep >=0.3.1
    - session-info2
    - mpi4py >=3.0.3
    - petsc >=3.18
    - slepc >=3.18
    - petsc4py >=3.18
    - slepc4py >=3.18

tests:
  - python:
      imports:
        - pygpcca
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/GPCCA/pyGPCCA
  license: LGPL-3.0-or-later
  license_file:
    - LICENSE
    - ThirdPartyNotices.txt
  summary: Generalized Perron Cluster Cluster Analysis
  description: |
    pyGPCCA employs Generalized Perron Cluster Cluster Analysis (G-PCCA) to coarse-grain reversible and in particular non-reversible Markov State Models.
    If you use pyGPCCA or parts of it, please cite Reuter et al. 2018 (https://doi.org/10.1021/acs.jctc.8b00079).
  documentation: https://pygpcca.readthedocs.io/
  repository: https://github.com/GPCCA/pyGPCCA

extra:
  recipe-maintainers:
    - Marius1311
    - msmdev
