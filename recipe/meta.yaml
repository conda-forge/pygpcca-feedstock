{% set name = "pyGPCCA" %}
{% set version = "1.1.0" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0]|lower }}/{{ name|lower }}/{{ name|lower }}-{{ version }}.tar.gz
  sha256: d537851aa18687e40a153639587458597bac0d0f070cf094d25ca4251e3d0022

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
  run:
    - python >={{ python_min }}
    - numpy >=1.19
    - scipy >=1.5
    - docrep >=0.3.1
    - session-info2
    - mpi4py >=3.0.3
    - petsc >=3.18
    - slepc >=3.18
    - petsc4py >=3.18
    - slepc4py >=3.18

test:
  imports:
    - pygpcca
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/GPCCA/pyGPCCA
  license: LGPL-3.0-or-later
  license_family: LGPL
  license_file:
    - LICENSE
    - ThirdPartyNotices.txt
  summary: Generalized Perron Cluster Cluster Analysis
  description: |
    pyGPCCA employs Generalized Perron Cluster Cluster Analysis (G-PCCA) to coarse-grain reversible and in particular non-reversible Markov State Models.
    If you use pyGPCCA or parts of it, please cite Reuter et al. 2018 (https://doi.org/10.1021/acs.jctc.8b00079).
  doc_url: https://pygpcca.readthedocs.io/
  dev_url: https://github.com/GPCCA/pyGPCCA

extra:
  recipe-maintainers:
    - Marius1311
    - msmdev
